apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    {{ toYaml .Values.app.labels }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{ toYaml .Values.app.labels }}
  template:
    metadata:
      labels:
        {{ toYaml .Values.app.labels }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: init-admin-db-user-script
        configMap:
          name: init-admin-db-user-script
          defaultMode: 0777
          items:
            - key: init-admin-db-user.sh
              path: init-admin-db-user.sh
      initContainers:
        - name: setup-tenant-admin-dbuser
          image: bitnamilegacy/postgresql:15.1.0-debian-11-r7
          command: [ "/bin/bash", "-c", "/init-db/init-admin-db-user.sh" ]
          volumeMounts:
            - name: init-admin-db-user-script
              mountPath: "/init-db"
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: init-admin-db-user-script-env
                  key: pgHost
                  optional: false
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: init-admin-db-user-script-env
                  key: pgPort
                  optional: false
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: init-admin-db-user-script-env
                  key: pgDatabase
                  optional: false
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: init-admin-db-user-script-env
                  key: pgUser
                  optional: false
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: init-admin-db-user-script-env
                  key: pgPassword
                  optional: false
            - name: APP_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: init-admin-db-user-script-env
                  key: appDbUser
                  optional: false
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.image.repository }}/{{ .Values.app.name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy : {{ .Values.image.pullPolicy }}
          {{ if .Values.app.command.entrypoint }}
          command: {{ .Values.app.command.entrypoint }}
          {{ end }}
          {{ if .Values.app.command.args }}
          args: {{ .Values.app.command.args }}
          {{ end }}
          startupProbe:
            httpGet:
              path: {{ .Values.app.health.probes.startup.endpoint }}
              port: http
            initialDelaySeconds: {{ .Values.app.health.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.health.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.app.health.probes.startup.failureThreshold }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          ports:
            - name: http
              containerPort: {{ .Values.app.networking.port.http }}
              protocol: TCP
            {{ if .Values.app.networking.port.debug }}
            - name: debug
              containerPort: {{ .Values.app.networking.port.debug }}
              protocol: TCP
            {{ end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.health.probes.liveness.endpoint }}
              port: http
            initialDelaySeconds: {{ .Values.app.health.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.health.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.health.probes.readiness.endpoint }}
              port: http
            initialDelaySeconds: {{ .Values.app.health.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.health.probes.readiness.periodSeconds }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.app.javaToolOptions | quote }}
            - name: AWS_JAVA_V1_DISABLE_DEPRECATION_ANNOUNCEMENT
              value: "true"
            - name: APP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: service-db
                  key: databaseUsername
                  optional: false
            - name: APP_ADMIN_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-db
                  key: databasePassword
                  optional: false
            - name: APP_HOST_URLS
              valueFrom:
                configMapKeyRef:
                  name: app-host-urls
                  key: appHostUrls
                  optional: false
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: service-db
                  key: databaseName
                  optional: false
            - name: ADMIN_TENANT_NAME
              valueFrom:
                configMapKeyRef:
                  name: admin-tenant-config
                  key: adminTenantName
                  optional: false
            - name: ADMIN_DS_SCHEMA_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: admin-tenant-config
                  key: adminDsSchemaPrefix
                  optional: false
            - name: TENANT_DS_SCHEMA_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: admin-tenant-config
                  key: tenantDsSchemaPrefix
                  optional: false
            - name: ADMIN_TENANT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: admin-tenant-config
                  key: adminTenantSchema
                  optional: false
            - name: DB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: service-db
                  key: databaseHost
                  optional: false
            - name: SPRING_DATASOURCE_URL
              value: "$(DB_BASE_URL)?currentSchema=$(ADMIN_TENANT_SCHEMA)"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: service-db
                  key: databaseUsername
                  optional: false
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-db
                  key: databasePassword
                  optional: false
            - name: AWS_SECRETS_MANAGER_REGION
              valueFrom:
                configMapKeyRef:
                  name: service-secrets-manager
                  key: awsSecretsManagerRegion
                  optional: false
            - name: AWS_SECRETS_MANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: service-secrets-manager
                  key: awsSecretsManagerUrl
                  optional: false
            - name: AWS_SECRETS_MANAGER_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: service-secrets-manager
                  key: awsSecretsManagerAccessKeyId
                  optional: false
            - name: AWS_SECRETS_MANAGER_ACCESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: service-secrets-manager
                  key: awsSecretsManagerAccessSecretKey
                  optional: false
            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: service-auth
                  key: jwtIssuerUri
                  optional: false
            - name: JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: service-auth
                  key: jwkSetUri
                  optional: false
            - name: AWS_COGNITO_REGION
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoRegion
                  optional: false
            - name: AWS_COGNITO_URL
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoUrl
                  optional: false
            - name: AWS_COGNITO_USER_POOL_ID
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoUserPoolId
                  optional: false
            - name: AWS_COGNITO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoAccessKeyId
                  optional: false
            - name: AWS_COGNITO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoSecretKey
                  optional: false
            - name: AWS_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-s3
                  key: awsS3Region
                  optional: false
            - name: AWS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: service-mt-provision-s3
                  key: awsS3AccessKeyId
                  optional: false
            - name: AWS_S3_ACCESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: service-mt-provision-s3
                  key: awsS3AccessSecretKey
                  optional: false
            - name: AWS_IAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: service-mt-provision-iam
                  key: awsIamAccessKeyId
                  optional: false
            - name: AWS_IAM_ACCESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: service-mt-provision-iam
                  key: awsIamAccessSecretKey
                  optional: false
            - name: AWS_DEPLOYMENT_ACCOUNT_ID
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-iam
                  key: awsDeploymentAccountId
                  optional: false
            - name: AWS_DEPLOYMENT_PARTITION
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-iam
                  key: awsDeploymentPartition
                  optional: false
            - name: AWS_COGNITO_IDENTITY_POOL_ID
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoIdentityPoolId
                  optional: false
            - name: AWS_COGNITO_USER_POOL_URL
              valueFrom:
                configMapKeyRef:
                  name: service-mt-provision-cognito
                  key: awsCognitoUserPoolUrl
                  optional: false
            - name: APP_NAME
              value: {{ .Values.app.name }} # TODO Fix later
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env | quote }}
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: service-redis
                  key: redisHost
                  optional: false
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: service-redis
                  key: redisPort
                  optional: false
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: service-redis
                  key: redisPassword
                  optional: false
            - name: TRISHUL_TENANT_MIGRATION_ON_STARTUP_ENABLED
              value: {{ .Values.trishul.tenantMigrationOnStartupEnabled | quote }}
            - name: TWILIO_ACCOUNT_SID
              value: {{ .Values.twilio.accountSid | quote }}
            - name: TWILIO_AUTH_TOKEN
              value: {{ .Values.twilio.authToken | quote }}