apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}
  annotations:
    {{- if .Values.app.networking.ingress.certManager }}
    cert-manager.io/cluster-issuer: {{ .Values.app.networking.ingress.clusterIssuer | default "cert-manager" }}
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.app.networking.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.app.networking.ingress.host }}
    secretName: {{ .Values.app.networking.ingress.host }}-tls
  {{- end }}
  rules:
  - host: {{ .Values.app.networking.ingress.host }}
    http:
      paths:
      - pathType: Prefix
        path: /api
        backend:
          service:
            name: app-svc-http
            port:
              number: {{ .Values.app.networking.httpService.port }}
      - pathType: Prefix
        path: /operations
        backend:
          service:
            name: app-svc-http
            port:
              number: {{ .Values.app.networking.httpService.port }}
      - pathType: Prefix
        path: /swagger
        backend:
          service:
            name: app-svc-http
            port:
              number: {{ .Values.app.networking.httpService.port }}
      - pathType: Prefix
        path: /actuator
        backend:
          service:
            name: app-svc-http
            port:
              number: {{ .Values.app.networking.httpService.port }}